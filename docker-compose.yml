networks:
  qtpnet:

volumes:
  postgres-data: {}
  keycloak-data: {}

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+psycopg2://qtp:qtp@postgres:5432/qtp"
  KEYCLOAK_PUBLIC_URL: "http://localhost:8080"
  KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "qtp"
  KEYCLOAK_SPA_CLIENT_ID: "qtp-spa"
  KEYCLOAK_AUDIENCE: "qtp-api"
  ALLOWED_ORIGINS: "http://localhost:5173"
  # The demo app-under-test lives inside the compose network on a private IP;
  # allow it (and the API self-tests target) past the SSRF private-range block.
  SSRF_ALLOWLIST: "httpbin,api,localhost,127.0.0.1"
  LOG_LEVEL: "INFO"
  # ── Kafka worker transport ──
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_RUNS_TOPIC: "qtp-workers"
  KAFKA_RUNS_PARTITIONS: "10"
  # ── Redis (required by the QF ETL worker framework) ──
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # ── Tracing → Jaeger (OTLP gRPC) ──
  ENABLE_TRACING: "true"
  OTLP_ENDPOINT: "http://jaeger:4317"

services:

  # ── PostgreSQL (QTP data) ────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: qtp-postgres
    networks: [qtpnet]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "qtp"
      POSTGRES_PASSWORD: "qtp"
      POSTGRES_DB: "qtp"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtp -d qtp"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # ── Kafka (KRaft, single broker) — worker work-distribution transport ────
  kafka:
    image: apache/kafka:3.9.0
    container_name: qtp-kafka
    networks: [qtpnet]
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      # In-network clients use kafka:9092; host tools use localhost:9094.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  # ── Kafka UI (inspect topics / partitions / consumer groups) ─────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: qtp-kafka-ui
    networks: [qtpnet]
    depends_on:
      kafka: {condition: service_healthy}
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "qtp"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  # ── Redis (required by the QF ETL kafka-worker runtime) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: qtp-redis
    networks: [qtpnet]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Jaeger (OTLP traces from backend + workers) ──────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: qtp-jaeger
    networks: [qtpnet]
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  # ── Keycloak (dev mode, realm imported from file) ────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: qtp-keycloak
    networks: [qtpnet]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/qtp HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  # ── Demo app-under-test (so the request builder has a real target) ───────
  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    container_name: qtp-httpbin
    networks: [qtpnet]
    ports:
      - "8088:8080"
    restart: unless-stopped

  # ── One-shot: create schema, seed data, create the runs topic (10 parts) ─
  init:
    build:
      context: .
      dockerfile: Dockerfile
    image: qtp-backend
    container_name: qtp-init
    networks: [qtpnet]
    working_dir: /app/backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      <<: *backend-env
      SERVICE_NAME: "qtp-init"
    command: ["python", "scripts/init_db.py"]
    restart: "no"

  # ── Backend: API + scheduler (merged), gunicorn + gevent, Kafka producer ─
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qtp-backend
    container_name: qtp-api
    networks: [qtpnet]
    working_dir: /app/backend
    ports:
      - "${API_PORT:-5100}:5100"
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      kafka: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ROLE: "api"
      SERVICE_NAME: "qtp-api"
      GUNICORN_WORKERS: "2"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    restart: unless-stopped

  # ── Worker: Kafka consumer of qtp-workers, scaled to 3 (own python app) ──
  # All replicas share consumer group WORKER_NAME=qtp-workers, so the broker
  # splits the 10 partitions across them. Scale with `replicas` (or GUNICORN_WORKERS).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qtp-backend
    networks: [qtpnet]
    working_dir: /app/worker
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ROLE: "worker"
      SERVICE_NAME: "qtp-worker"
      # Shared Kafka consumer group across every replica (partition split).
      WORKER_NAME: "qtp-workers"
      WORKER_CAPABILITIES: "http,python"
      GUNICORN_WORKERS: "1"
      PYTHONPATH: "/app/backend"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    deploy:
      replicas: 3
    restart: unless-stopped

  # ── Frontend (built SPA served by nginx) ─────────────────────────────────
  frontend:
    build: ./frontend
    image: qtp-frontend
    container_name: qtp-frontend
    networks: [qtpnet]
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
